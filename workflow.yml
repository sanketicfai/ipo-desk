name: IPO Desk - refresh data & publish dashboard

# Free forever: public repos get unlimited GitHub-hosted runner minutes and free Pages hosting.
# This job wakes up on a schedule, refreshes every source, writes the static dashboard
# into site/ and publishes it to GitHub Pages. Your PC can be switched off.

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"   # every 10 min, offset by 4 (dodges top-of-interval congestion)
  workflow_dispatch:               # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:                         # redeploy when you change the code or the dashboard
      - "ipo_desk.py"
      - "sources.py"
      - "market.py"
      - "merge.py"
      - "store.py"
      - "util.py"
      - "export_static.py"
      - "dashboard.html"
      - "cg_sub_cache.json"
      - "seed/**"
      - "ohlc_backfill.py"
      - "cg_sub_backfill.py"
      - "requirements.txt"
      - ".github/workflows/ipo-desk.yml"

permissions:
  contents: write                  # needed by the keep-alive heartbeat below
  pages: write
  id-token: write

# never let two refreshes overlap
concurrency:
  group: ipo-desk-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The SQLite database is the desk's memory (GMP history, fetched pages, source health).
      # It is handed from one run to the next through the Actions cache, so we never commit it.
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: ipo_desk.db*
          key: ipodesk-db-${{ github.run_id }}
          restore-keys: |
            ipodesk-db-

      - name: Refresh data and build the static site
        env:
          TZ: Asia/Kolkata
          PYTHONUNBUFFERED: "1"
        run: python ipo_desk.py --once --static-dir site --budget 420 --cg-budget 0

      - name: Save database
        if: always()
        continue-on-error: true          # a first-ever run may have nothing to save yet
        uses: actions/cache/save@v4
        with:
          path: ipo_desk.db*
          key: ipodesk-db-${{ github.run_id }}

      # ---------------------------------------------------------------- WHY THIS EXISTS
      # GitHub treats scheduled workflows as best-effort AND deprioritises repositories with
      # no recent activity: a quiet repo can see a "*/10" schedule fire only every few hours,
      # and after 60 days with no activity the schedule is disabled silently.
      # One tiny commit (a timestamp, ~30 bytes) every 6 hours keeps the repository "active",
      # so the refresh schedule keeps firing at full speed and can never be auto-disabled.
      # This commit touches no code. The paths filter above means it does not re-trigger itself.
      - name: Keep-alive heartbeat
        run: |
          set -e
          mkdir -p .state
          NOW=$(date -u +%s)
          LAST=$(cat .state/last-run 2>/dev/null || echo 0)
          AGE=$(( (NOW - LAST) / 3600 ))
          if [ "$AGE" -lt 6 ]; then
            echo "heartbeat is $AGE h old - nothing to do"
            exit 0
          fi
          date -u +"%Y-%m-%d %H:%M UTC" > .state/last-run
          git config user.name  "ipo-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .state/last-run
          git commit -m "heartbeat: keep the refresh schedule running"
          git push

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
