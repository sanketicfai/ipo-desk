<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPO Desk — by Sanket Vaghani</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<style>
  :root{
    --bg:#eef1f6; --panel:#ffffff; --panel2:#f6f8fb; --line:#e2e8f0; --line2:#cbd5e1;
    --text:#0f172a; --muted:#64748b; --dim:#94a3b8;
    --green:#059669; --green2:#10b981; --amber:#d97706; --red:#dc2626; --blue:#2563eb;
    --purple:#7c3aed; --cyan:#0891b2; --teal:#0d9488;
    --shadow:0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-size:14px}
  a{color:var(--blue); text-decoration:none} a:hover{text-decoration:underline}
  code{background:#eef2f7; padding:1px 5px; border-radius:4px; font-size:.92em}

  /* ---------- header ---------- */
  header{position:sticky; top:0; z-index:50; background:rgba(255,255,255,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); box-shadow:var(--shadow)}
  .hrow{max-width:1400px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .logowrap{display:flex; flex-direction:column; line-height:1.15}
  .logo{font-size:17px; font-weight:800; letter-spacing:.3px; white-space:nowrap}
  .logo span.g{color:var(--green)}
  .credit{font-size:14px; font-weight:800; color:#0f172a; letter-spacing:.4px; margin-left:7px; text-transform:uppercase}
  .credit em{color:var(--green); font-style:normal}
  .pill{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; padding:3px 10px; border-radius:99px; border:1px solid var(--line2); color:var(--muted); letter-spacing:.4px}
  .pill .dot{width:7px; height:7px; border-radius:50%; background:var(--muted)}
  .pill.live{color:#fff; background:var(--green); border-color:var(--green)}
  .pill.live .dot{background:#fff; animation:pulse 1.6s infinite}
  .pill.file{color:var(--amber); border-color:var(--amber)}
  .pill.file .dot{background:var(--amber)}
  .pill.sample,.pill.shared{color:var(--purple); border-color:var(--purple)}
  .pill.sample .dot,.pill.shared .dot{background:var(--purple)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .clock{font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px}
  .spacer{flex:1}
  .hbtn{background:#fff; border:1px solid var(--line2); color:var(--text); padding:7px 12px; border-radius:8px; font-size:12.5px; cursor:pointer; font-weight:600}
  .hbtn:hover{border-color:var(--blue); color:var(--blue)}
  select{background:#fff; border:1px solid var(--line2); color:var(--text); padding:7px 8px; border-radius:8px; font-size:12.5px; outline:none; cursor:pointer}
  .vseg{display:inline-flex; border:1px solid var(--line2); border-radius:8px; overflow:hidden}
  .vseg button{background:#fff; border:none; color:var(--muted); padding:7px 12px; font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap}
  .vseg button.on{background:var(--text); color:#fff}

  /* ---------- tabs ---------- */
  .tabs{max-width:1400px; margin:14px auto 0; padding:0 16px; display:flex; gap:8px; flex-wrap:wrap}
  .tab{background:#fff; border:1px solid var(--line2); color:var(--muted); padding:6px 13px; border-radius:99px; font-size:12.5px; font-weight:700; cursor:pointer; display:flex; gap:7px; align-items:center; white-space:nowrap}
  .tab .n{background:var(--panel2); border:1px solid var(--line); border-radius:99px; padding:1px 7px; font-size:11px; color:var(--muted)}
  .tab.on{background:var(--text); border-color:var(--text); color:#fff}
  .tab.on .n{background:rgba(255,255,255,.18); border-color:transparent; color:#fff}

  /* ---------- cards grid ---------- */
  .grid{max-width:1400px; margin:16px auto 26px; padding:0 16px; display:grid; grid-template-columns:repeat(auto-fill,minmax(370px,1fr)); gap:16px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); transition:border-color .15s; cursor:pointer}
  .card:hover{border-color:var(--line2)}
  .chead{padding:13px 15px 9px; display:flex; align-items:flex-start; gap:10px}
  .cname{font-size:15px; font-weight:750; line-height:1.25; flex:1}
  .badge{font-size:10px; font-weight:800; letter-spacing:.6px; padding:3px 9px; border-radius:6px; white-space:nowrap; margin-top:1px}
  .b-OPEN{background:#ecfdf5; color:var(--green); border:1px solid #a7f3d0}
  .b-UPCOMING{background:#eff6ff; color:var(--blue); border:1px solid #bfdbfe}
  .b-CLOSED{background:#fffbeb; color:var(--amber); border:1px solid #fde68a}
  .b-ALLOTTED{background:#f5f3ff; color:var(--purple); border:1px solid #ddd6fe}
  .b-LISTED{background:#f0fdfa; color:var(--teal); border:1px solid #99f6e4}
  .cbody{padding:0 15px 11px}
  .stat4{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px; margin-bottom:11px}
  .stat{background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:7px 9px}
  .stat .k{font-size:10px; color:var(--muted); letter-spacing:.4px; text-transform:uppercase; margin-bottom:2px; white-space:nowrap}
  .stat .v{font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .rowline{display:flex; align-items:center; gap:8px; margin:8px 0; flex-wrap:wrap}
  .chip{font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:6px; font-variant-numeric:tabular-nums; white-space:nowrap}
  .chip.ghost{background:var(--panel2); border:1px solid var(--line2); color:var(--text)}
  .chip.up{background:#ecfdf5; color:var(--green); border:1px solid #a7f3d0}
  .chip.down{background:#fef2f2; color:var(--red); border:1px solid #fecaca}
  .gmpcard{background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:9px 12px 6px; margin:4px 0 10px}
  .gmpnum{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .gmpnum b{font-size:16px; color:var(--text); font-variant-numeric:tabular-nums}
  .gmpnum .est{font-size:11px}
  .gmpnum .est b{font-size:12px}
  .gmpchart{margin-top:4px}

  /* subscription bars: share-wise + application-wise in bracket */
  .subs{display:flex; flex-direction:column; gap:6px; margin:6px 0 4px}
  .subrow2{display:grid; grid-template-columns:54px 1fr 150px; gap:10px; align-items:center; font-size:11.5px}
  .subrow2 .lbl{color:var(--muted); font-weight:700; letter-spacing:.4px}
  .bar{height:8px; background:#eef2f7; border:1px solid var(--line); border-radius:99px; overflow:hidden}
  .bar i{display:block; height:100%; border-radius:99px}
  .subrow2 .x{font-weight:800; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
  .x.lo{color:var(--red)} .x.mid{color:var(--amber)} .x.ok{color:var(--green)} .x.hi{color:#047857}
  .x .apps{color:var(--dim); font-weight:600; font-size:11px}

  /* timeline strip */
  .tstrip{display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin:11px 0 2px}
  .tstep{background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:6px 4px; text-align:center}
  .tstep .d{font-size:10.5px; color:var(--muted); font-weight:600}
  .tstep .l{font-size:9.5px; letter-spacing:.4px; text-transform:uppercase; color:var(--dim); margin-top:2px}
  .tstep.today{border-color:#fcd34d; background:#fffbeb}
  .tstep.today .d{color:var(--amber)}
  .tstep.past{opacity:.45}
  .cardhint{border-top:1px solid var(--line); color:var(--dim); font-size:10.5px; font-weight:700; letter-spacing:.5px; padding:7px 15px; text-transform:uppercase}

  /* ---------- Zerodha-style tables (full borders, compact) ---------- */
  .zwrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:8px; max-width:100%}
  table.zt{border-collapse:collapse; font-size:12.5px; background:#fff; max-width:100%}
  table.zt th{background:var(--panel2); color:var(--muted); font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; text-align:right; padding:8px 12px; border:1px solid var(--line2); white-space:nowrap}
  table.zt th:first-child{text-align:left}
  table.zt td{padding:7px 12px; border:1px solid var(--line2); text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
  table.zt td:first-child{text-align:left; font-weight:700}
  table.zt tbody tr:nth-child(even) td{background:#fafbfd}
  table.zt .pos{color:var(--green); font-weight:700}
  table.zt .neg{color:var(--red); font-weight:700}
  .znote{font-size:11px; color:var(--dim); margin-top:6px}

  /* ---------- detail page ---------- */
  .detail{max-width:960px; margin:0 auto; padding:16px 16px 40px}
  .dbar{display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap}
  .dback{background:#fff; border:1px solid var(--line2); border-radius:8px; padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--muted)}
  .dback:hover{color:var(--text); border-color:var(--blue)}
  .dtitle{font-size:20px; font-weight:800; line-height:1.25; flex:1; min-width:200px}
  .dchips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
  .dcard{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px 16px; margin-bottom:14px; box-shadow:var(--shadow)}
  .dcard>h3{font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
  .dtiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px}
  .dtile{background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:8px 10px}
  .dtile .l{font-size:10px; letter-spacing:.4px; text-transform:uppercase; color:var(--muted)}
  .dtile .v{font-size:13.5px; font-weight:750; margin-top:2px; font-variant-numeric:tabular-nums}
  .dtile.today{border-color:#fcd34d; background:#fffbeb}
  .dtile.today .v{color:var(--amber)}
  .dtile.past{opacity:.5}
  .gmphead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px}
  .gmphead .nm{font-weight:750; font-size:14.5px}
  .riskrow{display:grid; grid-template-columns:52px 60px 1fr 74px; gap:8px; align-items:center; font-size:11.5px; padding:3px 0; font-variant-numeric:tabular-nums}
  .riskrow .rt{color:var(--muted); font-weight:700}
  .risebar{height:7px; background:#eef2f7; border-radius:99px; overflow:hidden}
  .risebar i{display:block; height:100%; border-radius:99px}
  .up{color:var(--green); font-weight:800} .dn{color:var(--red); font-weight:800}
  .intralegend{display:flex; gap:12px; flex-wrap:wrap; font-size:10.5px; color:var(--muted); margin-bottom:4px}
  .intralegend i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px}
  .links{display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px}
  .subgrid{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start}
  @media (max-width:860px){ .subgrid{grid-template-columns:1fr} }
  .kv2{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px}
  .srcnote{font-size:10.5px; color:var(--dim); margin-top:6px}

  /* ---------- list view ---------- */
  .tablewrap{max-width:1400px; margin:16px auto 26px; padding:0 16px; overflow-x:auto; -webkit-overflow-scrolling:touch}
  .ltable{width:100%; border-collapse:separate; border-spacing:0; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow); font-size:12.5px; min-width:1020px}
  .ltable thead th{position:sticky; top:0; background:var(--panel2); color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; text-align:right; padding:8px 8px; border-bottom:1px solid var(--line2); white-space:nowrap; z-index:5}
  .ltable thead th:nth-child(1){text-align:left; position:sticky; left:0; z-index:6}
  .ltable thead th:nth-child(2){text-align:left}
  .ltable td{padding:7px 8px; text-align:right; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; white-space:nowrap}
  .ltable td:first-child{text-align:left; position:sticky; left:0; background:#fff; font-weight:700; max-width:230px; overflow:hidden; text-overflow:ellipsis}
  .ltable td:nth-child(2){text-align:left}
  .ltable tbody tr.lrow{cursor:pointer}
  .ltable tbody tr.lrow:hover td{background:#f8fafc}
  .ltable .pos{color:var(--green); font-weight:700}
  .ltable .neg{color:var(--red); font-weight:700}
  .ltable .dim{color:var(--dim)}
  .ltable td.appcell .a{display:block; font-size:9px; color:var(--dim); font-weight:600; margin-top:0; line-height:1.15}
  .lbar{display:inline-block; position:relative; width:110px; height:14px; background:#eef2f7; border:1px solid var(--line); border-radius:99px; overflow:hidden; vertical-align:middle}
  .lbar i{position:absolute; left:0; top:0; bottom:0; border-radius:99px; opacity:.9}
  .lbarpct{position:absolute; right:6px; top:50%; transform:translateY(-50%); font-size:10px; font-weight:800; color:#334155}
  .lbarprice{font-weight:700; margin-left:7px; font-variant-numeric:tabular-nums}
  .ltable td.appcell .a{display:block; font-size:10px; color:var(--dim); font-weight:600; margin-top:0; line-height:1.15}
  /* GMP graph view: list-wise rows, chart on the right */
  .gmprow{display:flex; gap:16px; align-items:stretch}
  .gmprow .gmpmeta{width:240px; flex:0 0 240px; display:flex; flex-direction:column; gap:7px; align-items:flex-start}
  .gmprow .gmpmeta .nm{font-weight:750; font-size:14px; line-height:1.3}
  .gmprow .gmpchart{flex:1; min-width:0; align-self:center}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--muted); margin:0 0 12px}
  .legend i{display:inline-block; width:16px; height:3px; border-radius:2px; margin-right:5px; vertical-align:middle}

  /* ---------- calendar view ---------- */
  .cal{max-width:1400px; margin:16px auto 26px; padding:0 16px}
  .calday{background:#fff; border:1px solid var(--line); border-radius:12px; margin-bottom:14px; overflow:hidden; box-shadow:var(--shadow)}
  .calday.today{border-color:#f59e0b; box-shadow:0 0 0 2px rgba(245,158,11,.22)}
  .calhead{padding:10px 14px; background:var(--panel2); font-weight:800; font-size:13.5px; display:flex; gap:10px; align-items:center; border-bottom:1px solid var(--line)}
  .calhead .tag{font-size:10px; font-weight:800; letter-spacing:.6px; padding:2px 8px; border-radius:6px; background:#eef2f7; color:var(--muted); text-transform:uppercase}
  .calday.today .calhead{background:#fffbeb; color:#92400e}
  .calday.today .calhead .tag{background:#fde68a; color:#92400e}
  .calrow{display:flex; gap:10px; padding:10px 14px; border-top:1px solid var(--line); flex-wrap:wrap; align-items:center; cursor:pointer}
  .calrow:first-of-type{border-top:none}
  .calrow:hover{background:#fafbfd}
  .evb{font-size:10px; font-weight:800; letter-spacing:.4px; padding:3px 8px; border-radius:6px; min-width:76px; text-align:center}
  .ev-Closes{background:#fef2f2; color:var(--red); border:1px solid #fecaca}
  .ev-Opens{background:#eff6ff; color:var(--blue); border:1px solid #bfdbfe}
  .ev-Allotment{background:#f5f3ff; color:var(--purple); border:1px solid #ddd6fe}
  .ev-Listing{background:#f0fdfa; color:var(--teal); border:1px solid #99f6e4}
  .calname{font-weight:750; flex:1; min-width:150px}
  .calband{font-weight:750; font-variant-numeric:tabular-nums; white-space:nowrap; min-width:78px; text-align:right}
  .calbar{flex:1 1 130px; height:16px; background:#eef2f7; border:1px solid var(--line); border-radius:99px; position:relative; overflow:hidden; min-width:110px}
  .calbar i{position:absolute; left:0; top:0; bottom:0; border-radius:99px; opacity:.9}
  .calbarpct{position:absolute; right:8px; top:50%; transform:translateY(-50%); font-size:10px; font-weight:800; color:#334155}
  .calest{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; min-width:88px; text-align:right}
  .calest b{color:var(--text)}

  /* ---------- GMP graph view ---------- */
  .gmplist{max-width:960px; margin:16px auto 26px; padding:0 16px}
  .banner{max-width:1400px; margin:14px auto 0; padding:0 16px}
  .banner .inner{background:#f5f3ff; border:1px solid #ddd6fe; border-radius:10px; padding:10px 14px; font-size:12.5px; color:#5b21b6}
  .empty{max-width:1400px; margin:40px auto; text-align:center; color:var(--muted)}

  #dropzone{position:fixed; inset:0; background:rgba(15,23,42,.75); border:3px dashed var(--green); z-index:100; display:none; align-items:center; justify-content:center; font-size:18px; font-weight:800; color:#fff}

  /* ---------- mobile ---------- */
  @media (max-width:700px){
    .hrow{padding:8px 10px; gap:8px}
    .logo{font-size:14px} .credit{font-size:11px; margin-left:4px}
    .gmprow{flex-direction:column}
    .gmprow .gmpmeta{width:auto; flex:none}
    .clock{font-size:10.5px; width:100%; order:10}
    .hbtn{padding:6px 9px; font-size:11.5px}
    .vseg button{padding:6px 8px; font-size:11px}
    select{font-size:11.5px; padding:6px 6px}
    .tabs{flex-wrap:nowrap; overflow-x:auto; padding:0 10px; -webkit-overflow-scrolling:touch}
    .grid{padding:0 10px; gap:12px; grid-template-columns:1fr}
    .stat4{grid-template-columns:1fr 1fr}
    .tstrip{grid-template-columns:1fr 1fr}
    .subrow2{grid-template-columns:50px 1fr 128px; gap:7px}
    .chead,.cbody{padding-left:12px; padding-right:12px}
    .tablewrap{padding:0 8px}
    .ltable{font-size:11.5px; min-width:920px}
    .ltable td{padding:7px 8px}
    .detail{padding:12px 10px 40px}
    .dtitle{font-size:16.5px}
    .dcard{padding:12px 12px 14px}
    .dtiles{grid-template-columns:1fr 1fr}
    table.zt th,table.zt td{padding:6px 9px}
    .cal{padding:0 10px}
    .calrow{padding:9px 11px}
    .calname{min-width:100%}
    .calbar{flex-basis:100%; order:6}
    .gmplist{padding:0 10px}
  }
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="logowrap">
      <div class="logo">📊 IPO <span class="g">Desk</span><span class="credit">by <em>Sanket Vaghani</em></span></div>
    </div>
    <div id="pill" class="pill"><span class="dot"></span><span id="pilltext">NO DATA</span></div>
    <div class="clock" id="clock"></div>
    <div class="spacer"></div>
    <div class="vseg">
      <button id="v-cards" class="on">▦ Cards</button><button id="v-list">☰ List</button><button id="v-cal">📅 Calendar</button><button id="v-gmp">📈 GMP Graph</button>
    </div>
    <select id="sort" title="Sort order">
      <option value="date">Sort: date wise</option>
      <option value="close">Sort: closing soon</option>
      <option value="gmp">Sort: GMP % ↓</option>
      <option value="size">Sort: issue size ↓</option>
      <option value="gain">Sort: listing gain ↓</option>
    </select>
    <button class="hbtn" id="refreshbtn" title="Re-fetch ipo_data.json now">↻</button>
    <input type="file" id="fileinput" accept=".json,.html,application/json" hidden>
  </div>
</header>

<div id="banner" class="banner" style="display:none"><div class="inner" id="bannertext"></div></div>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<div id="gmpview" class="gmplist" style="display:none"></div>
<div id="empty" class="empty" style="display:none"></div>

<div id="dropzone">⬇ Drop ipo_data.json to load it</div>

<script>
"use strict";
/* ================= state ================= */
const state = { data:null, mode:"none", tab:"ALL", sort:"date", view:"cards", timer:null, pollCountdown:60 };
const TABS = [["ALL","All"],["OPEN","Open"],["UPCOMING","Upcoming"],["CLOSED","Closed"],["ALLOTTED","Allotted"],["LISTED","Listed"]];
const ORDER = {UPCOMING:0, OPEN:1, CLOSED:2, ALLOTTED:3, LISTED:4};
const $ = id => document.getElementById(id);

/* ================= formatting helpers ================= */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nfIN = new Intl.NumberFormat("en-IN",{maximumFractionDigits:2});
const nfIN0 = new Intl.NumberFormat("en-IN",{maximumFractionDigits:0});
const money = n => n==null ? "—" : "₹"+nfIN.format(n);
const cr = n => n==null ? "—" : nfIN.format(n)+" Cr";
const pct = n => n==null ? "—" : (n>0?"+":"")+nfIN.format(n)+"%";
const xfmt = t => t==null ? "—" : nfIN.format(t)+"×";
function parseDate(iso){ if(!iso) return null; const p=iso.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function dayDiff(iso){ const d=parseDate(iso); if(!d) return null; const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }
function fdate(iso){ const d=parseDate(iso); if(!d) return "—"; return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"}); }
function fdatey(iso){ const d=parseDate(iso); if(!d) return "—"; return d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"}); }
const dayN = iso => { const dd=dayDiff(iso); return dd==null?null:dd; };
const nowISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
function fmtSlot(t){ const h=Math.floor(t), m=Math.round((t-h)*60); return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"); }
function slotOf(e){ return (e.slot!=null)?e.slot:(e.hour!=null?e.hour:null); }

/* ================= derived data ================= */
function gmpPct(ipo){ return (ipo.gmp_latest!=null && ipo.price_high) ? (ipo.gmp_latest/ipo.price_high*100) : null; }
function estListing(ipo){ return (ipo.gmp_latest!=null && ipo.price_high) ? ipo.price_high+ipo.gmp_latest : null; }
function minInvestment(ipo){
  const a=ipo.application_size||{};
  const r=a["RII"]||a["Retail"];
  if(r&&r.amount) return r.amount;
  if(ipo.price_high&&ipo.lot_size) return ipo.price_high*ipo.lot_size;
  return null;
}
/* scraped status can be stale (updater may lag) — dates are the truth */
function effStatus(ipo){
  const t=ipo.timeline||{}, st=ipo.status;
  const od=dayN(t.open), cd=dayN(t.close), ld=dayN(t.listing);
  if(ld!=null&&ld<0&&st!=="LISTED") return "LISTED";
  if(cd!=null&&cd<0&&(st==="OPEN"||st==="UPCOMING")) return "CLOSED";
  if(st==="UPCOMING"&&od!=null&&od<=0&&cd!=null&&cd>=0) return "OPEN";
  if(st==="OPEN"&&od!=null&&od>0) return "UPCOMING";
  return st;
}
function keyDate(ipo){
  const t=ipo.timeline||{};
  switch(ipo.status){
    case "UPCOMING": return t.open;
    case "OPEN":     return t.close;
    case "CLOSED":   return t.close;
    case "ALLOTTED": return t.listing;
    case "LISTED":   return t.listing;
    default: return null;
  }
}
function sortIpos(list){
  const c=[...list];
  if(state.sort==="date"){
    c.sort((a,b)=>{
      const s=(ORDER[a.status]??9)-(ORDER[b.status]??9);
      if(s) return s;
      const ka=keyDate(a), kb=keyDate(b);
      if(ka&&kb){
        const past={CLOSED:1,ALLOTTED:1,LISTED:1}[a.status];
        return past ? (ka<kb?1:ka>kb?-1:0) : (ka<kb?-1:ka>kb?1:0);
      }
      return (b.issue_size_cr||0)-(a.issue_size_cr||0);
    });
  }
  else if(state.sort==="close"){ const k=i=>{ const d=dayN(i.timeline&&i.timeline.close); return d==null?999:d; }; c.sort((a,b)=>k(a)-k(b)); }
  else if(state.sort==="gmp") c.sort((a,b)=>(gmpPct(b)||-999)-(gmpPct(a)||-999));
  else if(state.sort==="size") c.sort((a,b)=>(b.issue_size_cr||0)-(a.issue_size_cr||0));
  else if(state.sort==="gain") c.sort((a,b)=>((b.listing_gain_pct!=null?b.listing_gain_pct:-999)-(a.listing_gain_pct!=null?a.listing_gain_pct:-999)));
  return c;
}
function xCell(t){
  if(t==null) return `<span class="dim">—</span>`;
  const st = t>=3?"pos":t>=1?"":"neg";
  return `<span class="${st}">${xfmt(t)}</span>`;
}
const ZERO_APP={times:0};
/* share-wise × with application-wise × bracketed below */
function subCell(ss,sa){
  const base=xCell(ss&&ss.times);
  const a=sa?(sa.times!=null?`${nfIN.format(sa.times)}× app`:(sa.applied?appsStr(sa.applied):"")):"";
  if(!a) return `<td>${base}</td>`;
  return `<td class="appcell">${base}<span class="a">${a}</span></td>`;
}

/* ================= GMP line chart (% of upper price band, dates) ================= */
function gmpSeries(ipo){
  const ph=ipo.price_high; if(!ph) return [];
  const pricePts=(ipo.price_history||[]).filter(p=>p.price!=null).slice(-10);   // actual price, ~10 days after listing
  const pDates=new Set(pricePts.map(p=>p.date));
  const gmpPts=(ipo.gmp_daily_avg||[]).filter(d=>d.avg!=null&&d.date&&!pDates.has(d.date));
  const mk=(arr,kind)=>arr.map(p=>({date:p.date, v:(kind==="gmp"?p.avg:p.price)/ph*100, kind}));
  return [...mk(gmpPts,"gmp"), ...mk(pricePts,"price")].sort((a,b)=>a.date<b.date?-1:1);
}
function lineChartSVG(series,opts={}){
  const {w=640,h=170,mini=false}=opts;
  const pts=(series||[]).filter(p=>p.v!=null);
  if(!pts.length) return "";
  const n=pts.length;
  const yMax=Math.max(100, Math.ceil(Math.max(...pts.map(p=>p.v))/25)*25);   // scale rises 1-100% minimum
  const padL=mini?6:10, padR=mini?6:36, padT=mini?6:12, padB=mini?6:18;
  const iw=w-padL-padR, ih=h-padT-padB;
  const X=i=> n===1? padL+iw/2 : padL+i*iw/(n-1);
  const Y=v=> padT+(1-v/yMax)*ih;
  let out=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block" role="img">`;
  if(!mini){
    for(let g=0; g<=yMax; g+=25){
      const gy=Y(g);
      out+=`<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${w-padR}" y2="${gy.toFixed(1)}" stroke="${g===0?"#cbd5e1":"#eef2f7"}" stroke-width="1"/>`;
      out+=`<text x="${w-padR+5}" y="${(gy+3).toFixed(1)}" text-anchor="start" font-size="9" fill="#94a3b8">${g}%</text>`;
    }
    const step=Math.max(1,Math.ceil(n/7));
    pts.forEach((pp,i)=>{ if(i%step===0||i===n-1){ const d=parseDate(pp.date); const dl=d?d.getDate()+"/"+(d.getMonth()+1):pp.date;
      out+=`<text x="${X(i).toFixed(1)}" y="${h-5}" text-anchor="middle" font-size="9.5" fill="#94a3b8">${dl}</text>`; }});
  }
  const fi=pts.findIndex(p=>p.kind==="price");   // first actual-price point = listing day
  if(fi>0&&!mini){
    out+=`<line x1="${X(fi).toFixed(1)}" y1="${padT}" x2="${X(fi).toFixed(1)}" y2="${h-padB}" stroke="#94a3b8" stroke-dasharray="3 3" stroke-width="1"/>`;
    out+=`<text x="${(X(fi)+3).toFixed(1)}" y="${padT+8}" font-size="8.5" fill="#64748b">listed</text>`;
  }
  const gmpLine=pts.slice(0, fi<0?n:fi+1).map((p,i)=>X(i).toFixed(1)+","+Y(p.v).toFixed(1)).join(" ");
  out+=`<polyline points="${gmpLine}" fill="none" stroke="#10b981" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  if(fi>=0){
    const priceLine=pts.slice(fi).map((p,i)=>X(fi+i).toFixed(1)+","+Y(p.v).toFixed(1)).join(" ");
    out+=`<polyline points="${priceLine}" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  pts.forEach((p,i)=>{ const col=p.kind==="price"?"#2563eb":"#10b981";
    out+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===((fi<0?n:fi+1)-1)?3:2.2}" fill="${col}"><title>${p.date}: ${p.kind==="gmp"?"GMP":"price"} ${p.v.toFixed(1)}% of band</title></circle>`; });
  if(!mini&&pts.length){ const last=pts[n-1];
    out+=`<text x="${(X(n-1)-5).toFixed(1)}" y="${(Y(last.v)-6).toFixed(1)}" text-anchor="end" font-size="10" font-weight="700" fill="${last.kind==="price"?"#1d4ed8":"#047857"}">${last.v.toFixed(1)}%</text>`; }
  return out+"</svg>";
}
function intradaySVG(entries,w=560,h=150){
  const S=[["total_times","Total","#0891b2"],["qib_times","QIB","#7c3aed"],["nii_times","NII","#d97706"],["rii_times","RII","#059669"]];
  const vals=[]; entries.forEach(e=>S.forEach(([k])=>{ if(e[k]!=null) vals.push(e[k]); }));
  if(!vals.length) return "";
  const max=Math.max(...vals)*1.1||1, padL=34, padB=18, padT=8;
  const T0=9, T1=17.5;
  const xs=e=>{ const t=slotOf(e)??9; return padL+((t-T0)/(T1-T0))*(w-padL-8); };
  const ys=v=>h-padB-(v/max)*(h-padB-padT);
  let out=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">`;
  for(let g=1;g<=3;g++){ const gv=max*g/4, gy=ys(gv);
    out+=`<line x1="${padL}" y1="${gy}" x2="${w-8}" y2="${gy}" stroke="#e2e8f0" stroke-width="1"/><text x="${padL-4}" y="${gy+3}" fill="#94a3b8" font-size="9" text-anchor="end">${gv>=10?Math.round(gv):gv.toFixed(1)}×</text>`; }
  entries.forEach(e=>{ const t=slotOf(e)??9; if(Number.isInteger(t)) out+=`<text x="${xs(e)}" y="${h-5}" fill="#94a3b8" font-size="9" text-anchor="middle">${t}h</text>`; });
  S.forEach(([k,,c])=>{ const pts=entries.filter(e=>e[k]!=null).map(e=>xs(e).toFixed(1)+","+ys(e[k]).toFixed(1)).join(" ");
    if(pts) out+=`<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    entries.filter(e=>e[k]!=null).forEach(e=>{ out+=`<circle cx="${xs(e).toFixed(1)}" cy="${ys(e[k]).toFixed(1)}" r="2.4" fill="${c}"/>`; }); });
  return out+"</svg>";
}
function riseBlock(entries){
  const pts=entries.map(e=>({t:slotOf(e), q:e.qib_times})).filter(p=>p.t!=null&&p.q!=null).sort((a,b)=>a.t-b.t);
  if(pts.length<2) return "";
  let maxAbs=0; const rows=[];
  for(let i=1;i<pts.length;i++){
    if(!pts[i-1].q) continue;
    const rise=(pts[i].q-pts[i-1].q)/pts[i-1].q*100;
    maxAbs=Math.max(maxAbs,Math.abs(rise));
    rows.push({from:fmtSlot(pts[i-1].t), to:fmtSlot(pts[i].t), q:pts[i].q, rise});
  }
  if(!rows.length) return "";
  const body=rows.map(r=>{
    const w=maxAbs?Math.min(Math.abs(r.rise)/maxAbs*100,100):0;
    return `<div class="riskrow"><span class="rt">${r.from}→${r.to}</span><span>${nfIN.format(r.q)}×</span>
      <span class="risebar"><i style="width:${w.toFixed(0)}%;background:${r.rise>=0?"#10b981":"#f87171"}"></i></span>
      <span class="${r.rise>=0?"up":"dn"}">${r.rise>=0?"▲":"▼"} ${nfIN.format(Math.abs(r.rise))}%</span></div>`;
  }).join("");
  return `<div class="znote" style="margin-bottom:2px">green = institutions rushing in · red = cooling off</div>${body}`;
}

/* ================= shared bits ================= */
function setPill(mode,text){
  const p=$("pill"); p.className="pill "+(mode==="live"?"live":mode==="file"?"file":mode==="shared"?"shared":mode==="sample"?"sample":"");
  $("pilltext").textContent=text;
}
function barColor(t){ return t==null?"#94a3b8":t>=10?"#10b981":t>=3?"#34d399":t>=1?"#fbbf24":"#f87171"; }
function xClass(t){ if(t==null) return "lo"; if(t>=10) return "hi"; if(t>=3) return "ok"; if(t>=1) return "mid"; return "lo"; }
function subBars(ipo){
  const s=ipo.subscription_shares||{}, appsAll=ipo.subscription_applications||{};
  let rows=[["QIB",s.QIB,appsAll.QIB],["B-HNI",s.bNII,appsAll.bNII],["S-HNI",s.sNII,appsAll.sNII],["NII",s.NII,appsAll.NII],["RII",s.RII,appsAll.RII],["Employee",s.Employee,appsAll.Employee],["Total",s.Total,appsAll.Total]].filter(r=>r[1]);
  if(s.bNII&&s.sNII) rows=rows.filter(r=>r[0]!=="NII");
  if(!rows.length) return `<div class="srcnote">subscription data not available yet</div>`;
  const out=rows.map(([lbl,v,ap])=>{
    const t=v.times, w=Math.min((t||0)/20*100,100);
    const app=ap&&ap.times!=null?` <span class="apps">(${nfIN.format(ap.times)}× app)</span>`:(ap&&ap.applied?` <span class="apps">${appsStr(ap.applied)}</span>`:"");
    return `<div class="subrow2"><span class="lbl">${lbl}</span>
      <span class="bar"><i style="width:${(t==null?4:w).toFixed(1)}%;background:${barColor(t)}"></i></span>
      <span class="x ${xClass(t)}">${xfmt(t)}${app}</span></div>`;
  }).join("");
  return `<div class="subs">${out}</div>`;
}
function appsStr(v){
  const n = typeof v==="string" ? parseFloat(v.replace(/,/g,"")) : v;
  if(n==null||isNaN(n)) return "";
  if(n>=1e7) return `(${(n/1e7).toFixed(2)} Cr apps)`;
  if(n>=1e5) return `(${(n/1e5).toFixed(2)} L apps)`;
  if(n>=1e3) return `(${(n/1e3).toFixed(1)}k apps)`;
  return `(${n} apps)`;
}
function timelineStrip(ipo){
  const t=ipo.timeline||{};
  const steps=[["open","Opens"],["close","Closes"],["allotment","Allotment"],["listing","Listing"]];
  const today=nowISO();
  return `<div class="tstrip">`+steps.map(([k,l])=>{
    const iso=t[k]; if(!iso) return `<div class="tstep"><div class="d">—</div><div class="l">${l}</div></div>`;
    const cls = iso===today?"today":(dayN(iso)<0?"past":"");
    return `<div class="tstep ${cls}"><div class="d">${fdate(iso)}</div><div class="l">${l}</div></div>`;
  }).join("")+`</div>`;
}
function statusChips(ipo){
  const bits=[];
  if(ipo.status==="LISTED"){
    if(ipo.listing_price!=null) bits.push(`Issue ${money(ipo.price_high)} → Listed ${money(ipo.listing_price)} <span class="chip ${ipo.listing_gain_pct>=0?"up":"down"}">${pct(ipo.listing_gain_pct)}</span>`);
    if(ipo.current_price!=null) bits.push(`Now ${money(ipo.current_price)} <span class="chip ${ipo.current_gain_pct>=0?"up":"down"}">${pct(ipo.current_gain_pct)}</span>`);
  } else {
    if(ipo.status==="OPEN"&&dayN(ipo.timeline&&ipo.timeline.close)===0) bits.push(`<span class="chip down">⚡ CLOSES TODAY · 5 PM</span>`);
    if(ipo.status==="UPCOMING"&&dayN(ipo.timeline&&ipo.timeline.open)===0) bits.push(`<span class="chip up">⚡ OPENS TODAY</span>`);
  }
  return bits.join(" ");
}
function gmpBlock(ipo){
  if(ipo.status==="LISTED"&&ipo.listing_price!=null){
    return `<div class="gmpcard"><div class="gmpnum">listed <b>${money(ipo.listing_price)}</b> <span class="chip ${ipo.listing_gain_pct>=0?"up":"down"}">${pct(ipo.listing_gain_pct)}</span></div></div>`;
  }
  const g=ipo.gmp_latest, avg=ipo.gmp_daily_avg||[];
  if(g==null&&!avg.length) return "";
  const p=gmpPct(ipo), e=estListing(ipo);
  let html=`<div class="gmpcard"><div class="gmpnum">GMP <b>${g!=null?"₹"+nfIN.format(g):"—"}</b> ${p!=null?`<span class="chip ${p>=0?"up":"down"}">${pct(p)}</span>`:""} <span class="est">est. listing <b>${e!=null?money(e):"—"}</b></span></div>`;
  if(avg.length) html+=`<div class="gmpchart">${lineChartSVG(gmpSeries(ipo),{w:340,h:92})}</div>`;
  html+=`</div>`;
  return html;
}

/* ================= detail page ================= */
const catLabel=k=>k==="bNII"?"B-HNI":k==="sNII"?"S-HNI":k;
function num(v){ if(v==null) return "—"; const n=parseFloat(String(v).replace(/,/g,"")); return isNaN(n)?String(v):nfIN.format(n); }
function appSizeTable(ipo){
  const app=ipo.application_size||{};
  if(!Object.keys(app).length) return "";
  const band=ipo.price_high;
  const rows=Object.entries(app).map(([k,v])=>{
    const qty=v.shares, lots=v.lots, up=v.price!=null?v.price:band;
    const total=v.amount!=null?v.amount:(qty!=null&&up!=null?qty*up:null);
    return `<tr><td>${esc(catLabel(k))}</td><td>${lots!=null?nfIN0.format(lots):"—"}</td><td>${qty!=null?nfIN0.format(qty):"—"}</td><td>${up!=null?money(up):"—"}</td><td><b>${total!=null?money(total):"—"}</b></td></tr>`;
  }).join("");
  return `<div class="dcard"><h3>Application size — lots × shares × upper price band</h3>
    <div class="zwrap"><table class="zt"><thead><tr><th>Quota</th><th>Lots</th><th>Qty (shares)</th><th>× Upper band</th><th>= Total amount</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="znote">1 lot = ${ipo.lot_size?nfIN0.format(ipo.lot_size)+" shares":"—"} · Total = Lots × ${ipo.lot_size?nfIN0.format(ipo.lot_size):"lot"} × band price</div></div>`;
}
function subTables(ipo){
  const ss=ipo.subscription_shares||{}, sa=ipo.subscription_applications||{};
  const CATS=["QIB","bNII","sNII","NII","RII","Employee","Total"].filter(k=>ss[k]||sa[k]);

  const shareRows=CATS.filter(k=>ss[k]).map(k=>
    `<tr><td>${catLabel(k)}</td><td>${esc(ss[k].offered||"—")}</td><td>${esc(ss[k].applied||"—")}</td><td>${xCell(ss[k].times)}</td></tr>`).join("");
  const cl=v=>{ const n=parseFloat(String(v==null?"":v).replace(/,/g,"")); return isNaN(n)?null:nfIN0.format(n); };
  const appRows=CATS.map(k=>{
    if(k==="QIB") return `<tr><td>QIB</td><td>—</td><td>—</td><td><span class="dim">0×</span></td></tr>`;
    if(!sa[k]) return `<tr><td>${catLabel(k)}</td><td>—</td><td>—</td><td><span class="dim">—</span></td></tr>`;
    return `<tr><td>${catLabel(k)}</td><td>${cl(sa[k].offered)||"—"}</td><td>${cl(sa[k].applied)||"—"}</td><td>${xCell(sa[k].times)}</td></tr>`;
  }).join("");
  return `<div class="subgrid">
    <div class="dcard" style="margin-bottom:0"><h3>Subscription — share-wise</h3><div class="zwrap"><table class="zt">
      <thead><tr><th>Quota</th><th>Shares offered</th><th>Shares applied</th><th>Subscribed</th></tr></thead><tbody>${shareRows}</tbody></table></div></div>
    <div class="dcard" style="margin-bottom:0"><h3>Subscription — application-wise</h3><div class="zwrap"><table class="zt">
      <thead><tr><th>Quota</th><th>Apps offered</th><th>Apps received</th><th>Subscribed</th></tr></thead><tbody>${appRows}</tbody></table></div>
      <div class="znote">QIBs come through a few large applications — app-count shown as 0×</div></div>
  </div>`;
}

  }
  const q=ipo.qib_intraday||[];
  let intraSec="";
  if(q.length>=2){
    intraSec=`<div class="dcard"><h3>Closing-day intraday subscription (half-hourly, IST)</h3>
      <div class="intralegend"><span><i style="background:#0891b2"></i>Total</span><span><i style="background:#7c3aed"></i>QIB</span><span><i style="background:#d97706"></i>NII</span><span><i style="background:#059669"></i>RII</span></div>

/* single bar, left to right, % of GMP written on it (actual value, full bar at 100%+; red if negative) */
function gmpBarCell(ipo){
  const gp=gmpPct(ipo);
  let width=null, col="#10b981", label="", right="";
  if(ipo.status==="LISTED"&&ipo.current_price!=null){
    const gain=ipo.listing_gain_pct!=null?ipo.listing_gain_pct:(ipo.price_high?(ipo.current_price/ipo.price_high-1)*100:0);
    width=Math.min(Math.abs(gain),100); col=gain>=0?"#10b981":"#f87171";
    label=`${gain<0?"−":"+"}${nfIN.format(Math.abs(gain))}%`;
    right=money(ipo.current_price);
  } else if(ipo.gmp_latest!=null&&ipo.price_high){
    width=Math.min(Math.abs(gp),100); col=gp>=0?"#10b981":"#f87171";
    label=`${gp<0?"−":""}${nfIN.format(Math.abs(gp))}%`;
    right=money(estListing(ipo));
  }
  if(width==null) return `<span class="dim">—</span>`;
  return `<span class="lbar"><i style="width:${width.toFixed(1)}%;background:${col}"></i><span class="lbarpct">${label}</span></span><span class="lbarprice">${right}</span>`;

/* ================= CALENDAR VIEW ================= */
function calendarView(ipos){
  const today=nowISO();
  const byDate={};
  const EV=[["close","Closes"],["open","Opens"],["allotment","Allotment"],["listing","Listing"]];
  ipos.forEach(ipo=>{
    const t=ipo.timeline||{};
    EV.forEach(([k,label])=>{
      const iso=t[k]; if(!iso) return;
      if(dayN(iso)<0) return;
      (byDate[iso] ||= []).push({ipo,label});
    });
  });
  const dates=Object.keys(byDate).sort();
  if(!dates.length) return `<div class="empty">No upcoming IPO dates in the data yet.</div>`;
  return `<div class="cal">
    <div class="legend"><span><i style="background:#10b981"></i>bar = GMP % of upper band (red if negative · full bar = 100%+)</span><span>left = price band</span><span>right = EST / current price</span></div>
    `+dates.map(iso=>{
    const isToday=iso===today;
    const order={Closes:0,Opens:1,Allotment:2,Listing:3};
    const evs=byDate[iso].slice().sort((a,b)=>(order[a.label]-order[b.label])||a.ipo.name.localeCompare(b.ipo.name));
    const rows=evs.map(({ipo,label})=>{
      const g=ipo.gmp_latest, gp=gmpPct(ipo);
      let rightTxt="", barVal=null, barCol="#10b981";
      if(ipo.status==="LISTED"&&ipo.current_price!=null){
        rightTxt=`Now <b>${money(ipo.current_price)}</b>`;
        barVal=ipo.current_gain_pct; barCol=(ipo.current_gain_pct||0)>=0?"#10b981":"#f87171";
      } else if(g!=null&&ipo.price_high){
        rightTxt=`EST <b>${money(estListing(ipo))}</b>`;
        barVal=gp; barCol=(gp||0)>=0?"#10b981":"#f87171";
      }
      const band=ipo.price_low!=null?(ipo.price_high!==ipo.price_low?money(ipo.price_low)+"–"+money(ipo.price_high):money(ipo.price_high)):"—";
      let barLbl="", barW=null;
      if(ipo.status==="LISTED"&&ipo.current_price!=null){
        const gain=ipo.current_gain_pct!=null?ipo.current_gain_pct:(ipo.price_high?(ipo.current_price/ipo.price_high-1)*100:0);
        barW=Math.min(Math.abs(gain),100); barLbl=`${gain<0?"−":"+"}${nfIN.format(Math.abs(gain))}%`;
      } else if(g!=null&&ipo.price_high){
        barW=Math.min(Math.abs(gp),100); barLbl=`${gp<0?"−":""}${nfIN.format(Math.abs(gp))}%`;
      }
      const bar = barW==null
        ? `<span class="calbar"><span class="calbarpct" style="color:var(--dim)">GMP —</span></span>`
        : `<span class="calbar"><i style="width:${barW.toFixed(1)}%;background:${barCol}"></i><span class="calbarpct">${barLbl}</span></span>`;
      return `<div class="calrow" data-open="${esc(ipo.name)}">
        <span class="evb ev-${label}">${label}</span>
        <span class="calname">${esc(ipo.name)}</span>
        <span class="calband">${band}</span>
        ${bar}
        ${rightTxt?`<span class="calest">${rightTxt}</span>`:""}
      </div>`;
    }).join("");
    return `<div class="calday ${isToday?"today":""}">
      <div class="calhead">${isToday?`<span class="tag">TODAY</span>`:""} ${fdatey(iso)} <span style="font-weight:600;color:var(--dim);font-size:11.5px">${dayN(iso)===0?"":dayN(iso)===1?"· tomorrow":"· in "+dayN(iso)+" days"}</span></div>
      ${rows}</div>`;
  }).join("")+`</div>`;
}

/* ================= GMP GRAPH VIEW (list-wise rows) ================= */
function gmpGraphView(ipos){
  const rows=ipos.map(i=>({ipo:i, series:gmpSeries(i)}))
    .filter(r=>r.series.length)
    .sort((a,b)=>{
      const so=(ORDER[a.ipo.status]??9)-(ORDER[b.ipo.status]??9);
      if(so) return so;
      return (b.series[b.series.length-1].v)-(a.series[a.series.length-1].v);
    });
  if(!rows.length) return `<div class="empty">No GMP history yet.<br><span style="font-size:12.5px">The updater logs GMP several times a day and averages each day — this page builds itself day by day, then continues with the actual listing price for ~10 days.</span></div>`;
  return `<div class="gmplist">
    <div class="legend"><span><i style="background:#10b981"></i>GMP daily avg</span><span><i style="background:#2563eb"></i>price after listing</span><span>right scale = % of upper price band · x = date (d/m)</span></div>
    `+rows.map(({ipo,series})=>`
      <div class="dcard gmprow" data-open="${esc(ipo.name)}" style="cursor:pointer">
        <div class="gmpmeta"><span class="nm">${esc(ipo.name)}</span><span class="badge b-${esc(ipo.status)}">${esc(ipo.status)}</span></div>
        <div class="gmpchart">${lineChartSVG(series,{w:600,h:165})}</div>
      </div>`).join("")+`</div>`;
}

/* ================= render ================= */
function currentDetail(){
  const m=location.hash.match(/^#\/ipo\/(.+)$/);
  if(!m||!state.data) return null;
  return (state.data.ipos||[]).find(i=>i.name===decodeURIComponent(m[1]))||null;
}
function render(){
  if(!state.data){ $("grid").innerHTML=""; return; }
  const ipos=state.data.ipos||[];
  const det=currentDetail();
  const isDet=!!det;
  const isCal=!isDet&&state.view==="cal";
  const isGmp=!isDet&&state.view==="gmp";
  const showChrome=!isDet&&!isCal&&!isGmp;
  $("tabs").style.display = showChrome?"flex":"none";
  $("sort").style.display = showChrome?"inline-block":"none";
  $("banner").style.display = (state.mode==="sample"&&!isDet)?"block":"none";
  let dp=$("detailpage");
  if(isDet){
    $("grid").style.display="none"; $("gmpview").style.display="none"; $("empty").style.display="none";
    if(!dp){ dp=document.createElement("div"); dp.id="detailpage"; document.body.appendChild(dp); }
    dp.style.display="block";
    dp.innerHTML=detailHTML(det);
    $("backbtn").addEventListener("click",()=>{ history.length>1?history.back():location.hash=""; });
    window.scrollTo(0,0);
    return;
  }
  if(dp){ dp.innerHTML=""; dp.style.display="none"; }
  if(isGmp){
    $("grid").style.display="none"; $("empty").style.display="none";
    $("gmpview").style.display="block";
    $("gmpview").innerHTML=gmpGraphView(ipos);
    return;
  }
  $("gmpview").style.display="none";
  if(isCal){
    $("grid").style.display="block";
    $("grid").innerHTML=calendarView(ipos);
    $("empty").style.display="none";
    bindOpeners();
    return;
  }
  const counts={ALL:ipos.length}; ipos.forEach(i=>counts[i.status]=(counts[i.status]||0)+1);
  $("tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab ${state.tab===k?"on":""}" data-tab="${k}">${l} <span class="n">${counts[k]||0}</span></button>`).join("");
  let list=ipos.filter(i=>state.tab==="ALL"||i.status===state.tab);
  list=sortIpos(list);
  $("grid").style.display = state.view==="cards"?"grid":"block";
  $("grid").innerHTML = state.view==="cards" ? list.map(card).join("") : listView(list);
  $("empty").style.display=list.length?"none":"block";
  if(!list.length) $("empty").textContent="No IPOs in this category right now.";
  bindOpeners();
}
function bindOpeners(){
  document.querySelectorAll("[data-open]").forEach(el=>el.addEventListener("click",()=>{
    location.hash="#/ipo/"+encodeURIComponent(el.dataset.open);

}

/* ================= data loading ================= */
function load(json,mode){
  state.data=json; state.mode=mode;
  if(state.data&&state.data.ipos) state.data.ipos.forEach(i=>{ i.status=effStatus(i); });
  if(mode==="sample"){
    setPill("sample","SAMPLE DATA");
    $("bannertext").innerHTML=`<b>Showing built-in sample data.</b> Open the page through the live server preview, or serve it with <code>python -m http.server 8000</code> — or drag &amp; drop your <code>ipo_data.json</code> anywhere on this page.`;
  } else if(mode==="shared"){
    setPill("shared","SHARED SNAPSHOT");
  } else if(mode==="poll"||mode==="http"){
    setPill("live","LIVE");
    if(mode==="http") startPolling();
  } else if(mode==="file"){
    setPill("file","STATIC FILE");
  }
  render();
}
async function tryLoad(){
  if(window.__EMBEDDED_DATA__){ load(window.__EMBEDDED_DATA__,"shared"); return; }
  const isHTTP=location.protocol==="http:"||location.protocol==="https:";
  if(isHTTP){
    try{
      const r=await fetch("ipo_data.json",{cache:"no-store"});
      if(r.ok){ load(await r.json(),"http"); return; }
    }catch(e){}
  }
  load(SAMPLE,"sample");
}
function startPolling(){
  if(state.timer) clearInterval(state.timer);
  state.pollCountdown=60;
  state.timer=setInterval(async()=>{
    state.pollCountdown--;
    if(state.pollCountdown<=0){
      state.pollCountdown=60;
      try{
        const r=await fetch("ipo_data.json",{cache:"no-store"});
        if(r.ok){ const j=await r.json();
          if(!state.data||j.generated_at!==state.data.generated_at){ load(j,"poll"); }
        }
      }catch(e){}
    }
  },1000);
}

function readFileSmart(f){
  const r=new FileReader();
  r.onload=()=>{
    const txt=String(r.result);
    if((f.name||"").endsWith(".html")||txt.trimStart().startsWith("<")){
      const m=txt.match(/window\.__EMBEDDED_DATA__\s*=\s*([\s\S]*?);\s*<\//);
      if(m){ try{ load(JSON.parse(m[1].replace(/<\\\//g,"</")),"file"); return; }catch(e){} }
      alert("That HTML has no embedded IPO Desk data.");
      return;
    }
    try{ load(JSON.parse(txt),"file"); }
    catch(err){ alert("Could not parse that file as JSON: "+err.message); }
  };
  r.readAsText(f);
}
